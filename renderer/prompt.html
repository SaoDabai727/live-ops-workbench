<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>设置文档链接</title>
  <style>
    :root {
      --bg: #0A0E1A; --surface: #111827; --surface-2: #1F2937;
      --cyan: #00E5C0; --cyan-glow: rgba(0,229,192,0.3);
      --text: #E2E8F0; --muted: #94A3B8; --border: #1F2A3C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 4px var(--cyan-glow); }
      50% { box-shadow: 0 0 12px var(--cyan-glow); }
    }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { font-size: 15px; margin-bottom: 6px; }
    p.hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    input {
      width: 100%; padding: 8px 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 13px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
    .actions { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; }
    button {
      padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); font-size: 13px; cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
    button.primary { background: rgba(0,229,192,0.12); border-color: var(--cyan); color: var(--cyan); }
    button.primary:hover { background: rgba(0,229,192,0.2); }
  </style>
</head>
<body>
  <div class="box">
    <h2>设置文档链接</h2>
    <p class="hint">请输入你的飞书文档链接</p>
    <input id="url-input" type="text" placeholder="https://your-doc.feishu.cn/..." autofocus />
    <div class="actions">
      <button id="btn-cancel">取消</button>
      <button id="btn-save" class="primary">保存</button>
    </div>
  </div>
</body>
</html>
