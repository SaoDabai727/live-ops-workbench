<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>设置飞书文档链接</title>
  <style>
    :root {
      --bg: #161310; --surface: #211C18; --surface-2: #2A241F;
      --accent: #E8873A; --accent-bright: #F0A05A; --accent-ring: rgba(232, 135, 58, 0.28);
      --text: #F3EEE7; --muted: #A89F94; --border: #3A342E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 20px; width: 100%; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h2 { font-size: 15px; margin-bottom: 6px; font-weight: 650; }
    p.hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    input {
      width: 100%; padding: 8px 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 13px; outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-ring);
    }
    .actions { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; }
    button {
      padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); font-size: 13px; cursor: pointer;
      transition: border-color 0.18s, background 0.18s, color 0.18s;
    }
    button:hover { border-color: #4A423A; background: #3A322B; }
    button.primary {
      background: var(--accent); border-color: var(--accent); color: #1A120C; font-weight: 650;
    }
    button.primary:hover {
      background: var(--accent-bright); border-color: var(--accent-bright);
    }
  </style>
</head>
<body>
  <div class="box">
    <h2 id="prompt-title">设置飞书文档链接</h2>
    <p class="hint" id="prompt-hint">请输入飞书文档链接</p>
    <input id="url-input" type="text" placeholder="https://xxx.feishu.cn/..." autofocus />
    <div class="actions">
      <button id="btn-cancel">取消</button>
      <button id="btn-save" class="primary">保存</button>
    </div>
  </div>
</body>
</html>
