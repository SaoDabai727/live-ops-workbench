<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>直播间管理</title>
<style>
:root {
  --bg: #161310; --surface: #211C18; --surface-2: #2A241F; --surface-3: #3A322B;
  --accent: #E8873A; --accent-bright: #F0A05A; --accent-soft: rgba(232, 135, 58, 0.14);
  --accent-ring: rgba(232, 135, 58, 0.28);
  --text: #F3EEE7; --muted: #A89F94; --border: #3A342E; --border-light: #4A423A;
  --danger: #E85D4C; --ok: #5BAE6E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column; padding: 18px 18px 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.header h2 { font-size: 15px; font-weight: 700; color: var(--accent-bright); letter-spacing: 0.2px; }
.header .hint { font-size: 11px; color: var(--muted); }
.room-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
.room-list::-webkit-scrollbar { width: 4px; }
.room-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.room-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px 16px;
}
.card-header {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) 132px auto;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.card-num {
  font-size: 12px; color: var(--muted); font-weight: 650;
  text-align: center;
}
.card-header input {
  padding: 7px 10px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 13px; outline: none;
  transition: border-color .18s, box-shadow .18s; width: 100%;
}
.card-header input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-ring);
}
.card-del {
  background: none; border: none; font-size: 16px; cursor: pointer;
  color: var(--muted); width: 28px; height: 28px; border-radius: 6px;
  transition: all .15s; line-height: 1;
}
.card-del:hover { background: var(--danger); color: #fff; }

.meta-row {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label {
  font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .3px;
}
.field input, .field textarea {
  padding: 7px 10px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 12px; outline: none;
  transition: border-color .18s, box-shadow .18s; width: 100%;
  font-family: inherit;
}
.field input:focus, .field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-ring);
}
.field.profile textarea {
  resize: vertical;
  min-height: 64px;
  line-height: 1.45;
}

.anchor-section {
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.anchor-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.anchor-header .section-label {
  font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .3px;
}
.btn-add-anchor {
  padding: 4px 12px; border: 1px solid var(--accent); border-radius: 6px;
  background: var(--accent-soft); color: var(--accent-bright); font-size: 11px;
  cursor: pointer; transition: background .15s; font-weight: 600;
}
.btn-add-anchor:hover { background: rgba(232, 135, 58, 0.22); }

.anchor-list { display: flex; flex-direction: column; gap: 6px; }
.anchor-empty {
  font-size: 12px; color: var(--muted); padding: 8px 0 2px;
}
.anchor-row {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
}
.anchor-row input {
  padding: 4px 2px; background: transparent; border: none;
  border-bottom: 1px solid transparent;
  color: var(--text); font-size: 12px; outline: none; width: 100%;
}
.anchor-row input:focus { border-bottom-color: var(--accent); }
.anchor-row .anchor-order {
  font-size: 10px; color: var(--muted); text-align: center;
}
.anchor-toggle {
  width: 36px; height: 20px; border-radius: 10px; border: none; cursor: pointer;
  background: var(--border); position: relative; transition: background .2s;
}
.anchor-toggle.enabled { background: var(--accent); }
.anchor-toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  transition: transform .2s;
}
.anchor-toggle.enabled::after { transform: translateX(16px); }
.anchor-del {
  background: none; border: none; font-size: 14px; cursor: pointer;
  color: var(--muted); width: 24px; height: 24px; border-radius: 4px;
  transition: all .15s;
}
.anchor-del:hover { color: var(--danger); background: rgba(232, 93, 76, 0.12); }

.footer {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: space-between; align-items: center;
}
.footer button {
  padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px;
  cursor: pointer; transition: border-color .18s, background .18s, color .18s;
  background: var(--surface-2); color: var(--text); font-weight: 500;
}
.footer button:hover { border-color: var(--border-light); background: var(--surface-3); }
.actions { display: flex; gap: 8px; }
.actions .save {
  background: var(--accent); border-color: var(--accent); color: #1A120C; font-weight: 650;
}
.actions .save:hover {
  background: var(--accent-bright); border-color: var(--accent-bright);
}

.notify-card {
  margin-top: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px 16px;
  flex-shrink: 0;
}
.notify-card .section-label {
  font-size: 12px; color: var(--accent-bright); font-weight: 700;
  letter-spacing: .2px; margin-bottom: 4px;
}
.notify-card .section-hint {
  font-size: 11px; color: var(--muted); line-height: 1.45; margin-bottom: 12px;
}
.notify-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.notify-grid .field.full { grid-column: 1 / -1; }
.notify-actions {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-test-feishu {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.btn-test-feishu:hover { border-color: var(--accent); color: var(--accent-bright); }
.btn-test-feishu:disabled { opacity: 0.5; cursor: not-allowed; }
.feishu-test-status { font-size: 11px; color: var(--muted); line-height: 1.4; }
.feishu-test-status.ok { color: var(--ok); }
.feishu-test-status.err { color: var(--danger); }
</style>
</head>
<body>
<div class="header">
  <h2>直播间管理</h2>
  <span class="hint">日报请在「直播日报」页手动生成；确定日报后推送飞书群</span>
</div>
<div id="room-list" class="room-list"></div>
<div class="notify-card" id="notify-card">
  <div class="section-label">飞书推送（共用）</div>
  <div class="section-hint">Webhook 发文本；截图需开放平台 App（开通上传图片权限并发布）。凭证页：open.feishu.cn/app</div>
  <div class="notify-grid">
    <div class="field full">
      <span class="field-label">Webhook</span>
      <input id="feishu-webhook" type="text" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/..." />
    </div>
    <div class="field">
      <span class="field-label">App ID（发截图）</span>
      <input id="feishu-app-id" type="text" placeholder="cli_xxx" />
    </div>
    <div class="field">
      <span class="field-label">App Secret</span>
      <input id="feishu-app-secret" type="password" placeholder="应用密钥" />
    </div>
    <div class="field full">
      <span class="field-label">签名校验密钥（可选）</span>
      <input id="feishu-sign-secret" type="password" placeholder="机器人安全设置里的签名密钥" />
    </div>
  </div>
  <div class="notify-actions">
    <button type="button" id="btn-test-feishu" class="btn-test-feishu">测试推送文本</button>
    <span id="feishu-test-status" class="feishu-test-status"></span>
  </div>
</div>
<div class="footer">
  <button id="btn-add">＋ 添加直播间</button>
  <div class="actions">
    <button id="btn-cancel">取消</button>
    <button id="btn-save" class="save">保存</button>
  </div>
</div>
</body>
</html>
